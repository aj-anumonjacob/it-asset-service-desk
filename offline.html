<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · IT Portal</title>
<style>
:root{--bg:#f5f6fb;--text:#1e2235;--muted:#6b7189}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:500 15px/1.5 system-ui,-apple-system,sans-serif;padding:16px;text-align:center}
.box{max-width:360px}.ico{width:84px;height:84px;border-radius:26px;margin:0 auto 16px;display:grid;place-items:center;font-size:38px;background:#ecebff}
button{margin-top:16px;min-height:44px;padding:0 22px;border-radius:13px;border:0;background:#6366f1;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
p{color:var(--muted)}
</style></head>
<body><div class="box"><div class="ico">📡</div><h2>No connection</h2><p>The IT Portal needs the internet. For safety, nothing is saved on this device.</p><button onclick="location.reload()">Try again</button></div></body></html>
